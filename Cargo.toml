[package]
name = "navidrome-smart-plugin"
version = "0.1.0"
edition = "2024"
authors = ["Alexander Tyurinov <wardxela@gmail.com>"]
license = "GPL-3.0-only"
description = "Generate personalized mixes for Navidrome using AudioMuse AI"
repository = "https://github.com/rwxae/navidrome-smart-plugin"
homepage = "https://github.com/rwxae/navidrome-smart-plugin"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
extism-pdk = "1.4.1"
nd-pdk = { git = "https://github.com/navidrome/navidrome" }
serde = { version = "1.0.140", features = ["derive"] }
serde_json = "1.0.154"
urlencoding = "2.1.3"
linfa = "0.9"
linfa-clustering = "0.9"
ndarray = "0.16"